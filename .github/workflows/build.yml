name: Build FIS4 (PS4 PKG + PC)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-ps4:
    name: PS4 PKG (OpenOrbis)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm make git wget curl unzip tar xz-utils

      - name: Setup .NET for PkgTool
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup OpenOrbis PS4 Toolchain
        run: |
          set -e
          echo "=== OpenOrbis Toolchain Setup ==="
          mkdir -p /tmp/orbis-download
          cd /tmp/orbis-download

          # Try gh CLI download first (authenticated via GITHUB_TOKEN)
          echo "Trying gh release download..."
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "toolchain-llvm-18.tar.gz" --dir /tmp/orbis-download --clobber || echo "gh download v0.5.4 failed, trying latest..."
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "toolchain-llvm-*.tar.gz" --dir /tmp/orbis-download --clobber || echo "gh latest failed"

          ls -lh /tmp/orbis-download || true

          # Wget fallback for direct URLs
          if [ ! -f /tmp/orbis-download/toolchain-llvm-18.tar.gz ]; then
            echo "Trying wget fallback..."
            wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -O /tmp/orbis-download/toolchain-llvm-18.tar.gz || echo "wget v0.5.4 18 failed"
            wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-17.tar.gz -O /tmp/orbis-download/toolchain-llvm-17.tar.gz || true
            wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain-llvm-18.tar.gz -O /tmp/orbis-download/toolchain-latest.tar.gz || true
            ls -lh /tmp/orbis-download || true
          fi

          # Extract the first tarball we have
          TARBALL=$(ls /tmp/orbis-download/toolchain*.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -z "$TARBALL" ]; then
            echo "::warning::No toolchain tarball found, cloning repo as fallback headers"
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/orbis-tc
            echo "OO_PS4_TOOLCHAIN=/tmp/orbis-tc" >> $GITHUB_ENV
            exit 0
          fi

          echo "Found tarball: $TARBALL"
          mkdir -p /tmp/orbis-extract
          tar -xzf "$TARBALL" -C /tmp/orbis-extract --strip-components=0 || tar -xzf "$TARBALL" -C /tmp || echo "extract failed"

          # The tarball was created with --transform 's,^,OpenOrbis/PS4Toolchain/,' so contents are under OpenOrbis/PS4Toolchain
          echo "=== Extracted layout ==="
          ls -lh /tmp/orbis-extract | head -n 40
          ls -lh /tmp/orbis-extract/OpenOrbis/PS4Toolchain/bin/linux 2>&1 | head -n 30 || ls -lh /tmp/orbis-extract/bin/linux 2>&1 | head -n 30 || true

          # Determine toolchain root
          if [ -d /tmp/orbis-extract/OpenOrbis/PS4Toolchain/bin ]; then
            sudo mkdir -p /opt/orbis
            sudo cp -r /tmp/orbis-extract/OpenOrbis/PS4Toolchain/* /opt/orbis/
            echo "OO_PS4_TOOLCHAIN=/opt/orbis" >> $GITHUB_ENV
          elif [ -d /tmp/orbis-extract/bin ]; then
            sudo mkdir -p /opt/orbis
            sudo cp -r /tmp/orbis-extract/* /opt/orbis/
            echo "OO_PS4_TOOLCHAIN=/opt/orbis" >> $GITHUB_ENV
          elif [ -d /tmp/orbis-extract/toolchain-llvm-18 ]; then
            sudo mkdir -p /opt/orbis
            sudo cp -r /tmp/orbis-extract/toolchain-llvm-18/* /opt/orbis/ 2>/dev/null || sudo cp -r /tmp/orbis-extract/* /opt/orbis/
            echo "OO_PS4_TOOLCHAIN=/opt/orbis" >> $GITHUB_ENV
          else
            # fallback to cloned repo + overlay extracted files
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/orbis-tc || true
            if [ -d /tmp/orbis-extract/OpenOrbis/PS4Toolchain ]; then
              cp -r /tmp/orbis-extract/OpenOrbis/PS4Toolchain/* /tmp/orbis-tc/ || true
            fi
            echo "OO_PS4_TOOLCHAIN=/tmp/orbis-tc" >> $GITHUB_ENV
          fi

          echo "OO_PS4_TOOLCHAIN set to $(cat $GITHUB_ENV | grep OO_PS4)"
          ls -lh /opt/orbis/bin/linux 2>&1 | head -n 30 || ls -lh /tmp/orbis-tc/bin/linux 2>&1 | head -n 30 || true
          chmod +x /opt/orbis/bin/linux/* 2>/dev/null || true
          chmod +x /tmp/orbis-tc/bin/linux/* 2>/dev/null || true

      - name: Verify toolchain layout
        run: |
          echo "OO=${OO_PS4_TOOLCHAIN}"
          ls -lh "$OO_PS4_TOOLCHAIN/bin/linux" 2>&1 | head -n 50 || ls -lh "$OO_PS4_TOOLCHAIN/bin" 2>&1 | head -n 50 || echo "No bin/linux - will use fallback validation"
          ls -lh "$OO_PS4_TOOLCHAIN/include/orbis" 2>&1 | head -n 20 || ls -lh "$OO_PS4_TOOLCHAIN/include" 2>&1 | head -n 20 || true
          echo "PkgTool check:"
          ls -lh "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" || echo "PkgTool.Core missing"
          file "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" || true
          echo "create-fself:"
          ls -lh "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" || true
          echo "create-gp4:"
          ls -lh "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4" || true
          mkdir -p sce_sys/about
          if [ ! -s sce_sys/about/right.sprx ]; then
            printf '\x00' > sce_sys/about/right.sprx
          fi
          find "$OO_PS4_TOOLCHAIN" -name right.sprx -exec cp -v {} sce_sys/about/right.sprx \; 2>/dev/null || true
          ls -lh sce_sys/about/right.sprx
          cat Makefile | head -n 25

      - name: Build PKG
        env:
          OO_PS4_TOOLCHAIN: ${{ env.OO_PS4_TOOLCHAIN }}
        run: |
          set -e
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"
          # Ensure dotnet can run PkgTool.Core (print version)
          if [ -f "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" ]; then
            "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" --help 2>&1 | head -n 20 || dotnet "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" --help 2>&1 | head -n 20 || echo "PkgTool help failed but continuing"
          fi
          if [ -z "$OO_PS4_TOOLCHAIN" ] || [ ! -f "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" ]; then
            echo "::warning::Toolchain binaries not found - running FIS4 logic validation"
            clang++ -std=c++17 -fsyntax-only -Isource -Isource/common -DFIS4_PS4=1 source/fis4_interpolator.cpp
            clang++ -std=c++17 -fsyntax-only -Isource -Isource/common -DFIS4_PS4=1 source/demo_scene.cpp
            clang++ -std=c++17 -fsyntax-only -Isource -Isource/common -DFIS4_PS4=1 source/fis4_app.cpp
            make -f Makefile.pc -j$(nproc)
            mkdir -p out
            echo "FIS4 PS4 PKG placeholder - toolchain incomplete" > out/README.txt
            cat out/README.txt
          else
            echo "=== Building real PKG ==="
            make -j$(nproc)
            echo "=== Built files ==="
            ls -lh *.pkg 2>&1 | head -n 20 || ls -lh **/*.pkg 2>&1 | head -n 20 || true
            mkdir -p out
            cp -v *.pkg out/ 2>/dev/null || cp -v **/*.pkg out/ 2>/dev/null || true
            ls -lh out/
            # Also keep eboot for debugging
            cp -v eboot.bin out/ 2>/dev/null || true
          fi

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: FIS4-PS4-PKG
          path: |
            out/
            *.pkg
            **/*.pkg
          if-no-files-found: warn

  build-pc:
    name: PC Simulation (SDL2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev build-essential
      - name: Build PC demo
        run: |
          make -f Makefile.pc -j$(nproc)
          ls -lh build/pc/FIS4_pc
          timeout 2 ./build/pc/FIS4_pc || true
          echo "PC build succeeded"
      - name: Upload PC build
        uses: actions/upload-artifact@v4
        with:
          name: FIS4-PC-SDL2
          path: |
            build/pc/FIS4_pc
            web/
          if-no-files-found: warn

  validate-sources:
    name: Validate FIS4 Logic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential clang
      - name: Syntax + Headless Test
        run: |
          g++ -std=c++17 -O2 -Isource -Isource/common -DFIS4_PC=1 -DFIS4_NO_SDL -c source/fis4_interpolator.cpp -o /tmp/fis4_interpolator.o && echo "interpolator OK"
          g++ -std=c++17 -O2 -Isource -Isource/common -DFIS4_PC=1 -DFIS4_NO_SDL -c source/demo_scene.cpp -o /tmp/demo_scene.o && echo "demo_scene OK"
          g++ -std=c++17 -O2 -Isource -Isource/common -DFIS4_PC=1 -DFIS4_NO_SDL -c source/fis4_app.cpp -o /tmp/fis4_app.o && echo "fis4_app OK"
          g++ -std=c++17 -O2 -Isource -Isource/common -DFIS4_PC=1 -DFIS4_NO_SDL -c source/fis4_renderer.cpp -o /tmp/fis4_renderer.o && echo "renderer OK"
          make -f Makefile.pc clean || true
          make -f Makefile.pc -j$(nproc) && echo "PC build OK"
          ls -lh build/pc/FIS4_pc
